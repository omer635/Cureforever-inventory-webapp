/* Safe Numeric Helpers to Prevent NaN / Null Violations */
function safeNum(val, defaultVal = 0.0) {
  if (val === null || val === undefined) return defaultVal;
  const s = String(val).replace(/[^0-9.-]/g, '').trim();
  if (!s) return defaultVal;
  const n = parseFloat(s);
  return isNaN(n) ? defaultVal : n;
}

function safeInt(val, defaultVal = 10) {
  if (val === null || val === undefined) return defaultVal;
  const s = String(val).replace(/[^0-9-]/g, '').trim();
  if (!s) return defaultVal;
  const n = parseInt(s, 10);
  return isNaN(n) ? defaultVal : n;
}

function esc(str){
  if(str === null || str === undefined) return "";
  return String(str).replace(/[&<>"']/g, ch => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  }[ch]));
}

function formatCurrency(num){

/* ============================================================
   4. REALTIME SYNC
   ============================================================ */
function subscribeRealtime(){
  if(realtimeChannel) return;
  realtimeChannel = sb.channel("inventory-live-v2")
    .on("postgres_changes", { event: "*", schema: "public", table: "stock_entries" }, scheduleRefresh)
    .on("postgres_changes", { event: "*", schema: "public", table: "product_batches" }, scheduleRefresh)
    .on("postgres_changes", { event: "*", schema: "public", table: "stock_adjustments" }, scheduleRefresh)
    .on("postgres_changes", { event: "*", schema: "public", table: "reorder_requests" }, scheduleRefresh)
    .on("postgres_changes", { event: "*", schema: "public", table: "vendors" }, scheduleRefresh)
    .on("postgres_changes", { event: "*", schema: "public", table: "products" }, scheduleRefresh)
    .on("postgres_changes", { event: "*", schema: "public", table: "product_visibility" }, scheduleRefresh)
    .on("postgres_changes", { event: "*", schema: "public", table: "announcements" }, scheduleRefresh)
    .on("postgres_changes", { event: "*", schema: "public", table: "announcement_reads" }, scheduleRefresh)
    .subscribe();
}
function unsubscribeRealtime(){
  if(realtimeChannel){ sb.removeChannel(realtimeChannel); realtimeChannel = null; }
}
function scheduleRefresh(){
  if(refreshPending) return;
  refreshPending = true;
  setTimeout(async () => {
    refreshPending = false;
    const active = document.activeElement;
    const isTyping = active && (active.tagName === "INPUT" || active.tagName === "TEXTAREA" || active.tagName === "SELECT");
    const modalOpen = modalRoot.innerHTML.trim() !== "";
    if(isTyping || modalOpen){ scheduleRefresh(); return; }
    if(!vendorRow || !document.getElementById("main")) return;
    await loadAll();
    refreshCurrentView();
    flashLiveIndicator();
  }, 800);
}
function flashLiveIndicator(){
  const el = document.getElementById("liveDot");
  if(!el) return;
  el.classList.add("pulse");
  clearTimeout(liveIndicatorTimer);
  liveIndicatorTimer = setTimeout(() => el.classList.remove("pulse"), 1200);
}
function refreshCurrentView(){
  if(!vendorRow) return;
  if(vendorRow.is_admin) renderAdminView();
  else renderVendorView();
}

/* ============================================================
   5. DATA LOADING
   ============================================================ */
async function loadAll(){
  const [p, pb, v, s, sa, r, pv, an, ar] = await Promise.all([
    sb.from("products").select("*").order("name"),
    sb.from("product_batches").select("*").order("expiry_date"),
    sb.from("vendors").select("*").order("state"),
    sb.from("stock_entries").select("*"),
    sb.from("stock_adjustments").select("*").order("created_at", { ascending: false }).limit(150),
    sb.from("reorder_requests").select("*").order("created_at", { ascending: false }),
    sb.from("product_visibility").select("*"),
    sb.from("announcements").select("*").order("created_at", { ascending: false }),
    sb.from("announcement_reads").select("*")
  ]);
  products = p.data || [];
  productBatches = pb.data || [];
  vendors = v.data || [];
  stockEntries = s.data || [];
  stockAdjustments = sa.data || [];
  reorderRequests = r.data || [];
  productVisibility = pv.data || [];
  announcements = an.data || [];
  announcementReads = ar.data || [];

  visibilityMap = {};
  productVisibility.forEach(row => {
    if(!visibilityMap[row.product_id]) visibilityMap[row.product_id] = new Set();
    visibilityMap[row.product_id].add(row.vendor_id);
  });
}

function daysUntil(dateStr){
  if(!dateStr) return null;
  const today = new Date();
  today.setHours(0,0,0,0);
  const target = new Date(dateStr + "T00:00:00");
  return Math.round((target - today) / (1000*60*60*24));
}
function formatDate(dateStr, includeTime = false){
  if(!dateStr) return "Never";
  const d = new Date(dateStr);
  if(isNaN(d.getTime())) return "Never";
  return includeTime ? d.toLocaleString() : d.toLocaleDateString();
}
function stockStatus(entry, product){
  const flags = [];
  if(entry.quantity <= 0) flags.push({level:"danger", text:"Out of stock", type:"low"});
  else if(entry.quantity <= product.low_stock_threshold) flags.push({level:"warn", text:"Low stock", type:"low"});
  if(entry.expiry_date){
    const d = daysUntil(entry.expiry_date);
    if(d < 0) flags.push({level:"danger", text:"Expired", type:"expiry"});
    else if(d <= 30) flags.push({level:"warn", text: d + "d to expiry", type:"expiry"});
  }
  return flags;
}
function isProductVisible(productId, vendorId){
  const set = visibilityMap[productId];
  return !set || set.size === 0 || set.has(vendorId);
}

  modalRoot.innerHTML = `

      <div class="modal">
        <button class="modal-close" id="closeX">×</button>
        <h3>🏢 Create Vendor Account</h3>
        <p class="modal-sub">Creates vendor login credentials and assigns state inventory access securely.</p>

        <input id="vPhone" type="tel" placeholder="e.g. 9876543210">
        <label>Vendor Login Email</label>
        <input id="vEmail" type="email" placeholder="vendor@cureforever.com" autocomplete="off">
        <label>Temporary Password (min 6 chars)</label>
        <input id="vPass" type="password" placeholder="••••••••" autocomplete="off">
        <div class="modal-actions">
          <button class="btn-secondary" id="cancelV">Cancel</button>

      </div>

  `;
  document.getElementById("closeX").onclick = closeModal;
  document.getElementById("cancelV").onclick = closeModal;
  document.getElementById("overlay").onclick = (e) => { if(e.target.id === "overlay") closeModal(); };

  document.getElementById("saveV").onclick = async () => {
    const name = document.getElementById("vName").value.trim();
    const state = document.getElementById("vState").value.trim();
    const phone = document.getElementById("vPhone").value.trim() || null;
    const email = document.getElementById("vEmail").value.trim();
    const password = document.getElementById("vPass").value;

    if(!name || !state || !email || !password){
      showToast("Name, State, Email, and Password are required");
      return;
    }
    if(password.length < 6){
      showToast("Password must be at least 6 characters long");
      return;
    }

    const btn = document.getElementById("saveV");
    btn.disabled = true; btn.textContent = "Creating Account...";

    try {
      const secondarySb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: false } });
      const { data: authData, error: authError } = await secondarySb.auth.signUp({ email, password });

      if(authError){
        showToast("Auth Creation Error: " + authError.message);
        btn.disabled = false; btn.textContent = "Create Vendor";
        return;
      }

      const newUserId = authData.user.id;

      const { data: vendorData, error: vendorError } = await sb.from("vendors").insert({
        user_id: newUserId,
        name: name,
        state: state,
        contact_phone: phone,
        is_admin: false
      }).select().single();

      if(vendorError){
        showToast("Vendor Profile Error: " + vendorError.message);
        btn.disabled = false; btn.textContent = "Create Vendor";
        return;
      }

      showToast(`✓ Vendor Account "${name}" Created Successfully!`);
      closeModal();
      await loadAll();
      adminVendorTabId = vendorData.id;
      adminTab = "vendors";
      renderAdminView();

    } catch(err) {
      showToast("Error: " + err.message);
      btn.disabled = false; btn.textContent = "Create Vendor";
    }
  };
}

/* Hardware Barcode & QR Code Scanner Modal */
function openBarcodeScannerModal(){
  modalRoot.innerHTML = `
    <div class="modal-overlay" id="overlay">
      <div class="modal" style="max-width:500px;">
        <button class="modal-close" id="closeX">×</button>
        <h3>📷 Hardware Barcode & QR Scanner</h3>
        <p class="modal-sub">Align SKU, Barcode, or Batch QR code inside the camera viewfinder.</p>
        <div id="qr-reader"></div>
        <div id="scanResult" style="margin-top:14px;font-weight:600;color:var(--navy);text-align:center;">Scanning active camera stream…</div>
        <div class="modal-actions">
          <button class="btn-secondary" id="closeScanner">Close Scanner</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById("closeX").onclick = closeModal;
  document.getElementById("closeScanner").onclick = closeModal;
  document.getElementById("overlay").onclick = (e) => { if(e.target.id === "overlay") closeModal(); };

  setTimeout(() => {
    try {
      scannerInstance = new Html5Qrcode("qr-reader");
      scannerInstance.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 260, height: 200 } },
        (decodedText) => {
          const code = decodedText.trim();
          document.getElementById("scanResult").innerHTML = `<span style="color:var(--ok);">✓ Scanned: <strong>${esc(code)}</strong></span>`;
          
          const matched = products.find(p => p.sku.toLowerCase() === code.toLowerCase() || (p.barcode && p.barcode.toLowerCase() === code.toLowerCase()));
          const matchedBatch = productBatches.find(b => b.batch_number.toLowerCase() === code.toLowerCase());

          if(matched){
            showToast(`Scanned product: ${matched.name}`);
            closeModal();
            adminTab = "allstock";
            adminSearch = matched.sku;
            renderAdminView();
          } else if(matchedBatch){
            showToast(`Scanned Batch: ${matchedBatch.batch_number}`);
            closeModal();
            adminTab = "batches";
            renderAdminView();
          } else {
            document.getElementById("scanResult").innerHTML = `<span style="color:var(--warn);">Scanned code "${esc(code)}" not found in SKU catalog.</span>`;
          }
        },
        (_errorMessage) => {}
      ).catch(err => {
        document.getElementById("qr-reader").innerHTML = `<div style="padding:30px;color:var(--danger);text-align:center;">Camera Access Error: ${esc(err.message || err)}</div>`;
      });
    } catch(e) {
      console.error("Scanner Error:", e);
    }
  }, 300);
}

/* ============================================================
   8. SHARED STOCK TABLE
   ============================================================ */
function computeVendorRows(vendorId, respectVisibility){
  let list = products;
  if(respectVisibility) list = list.filter(p => isProductVisible(p.id, vendorId));
  return list.map(p => {
    const entry = stockEntries.find(e => e.product_id === p.id && e.vendor_id === vendorId)
      || { vendor_id: vendorId, product_id: p.id, quantity: 0, expiry_date: null, notes: "" };
    return { product: p, entry };
  });
}

function stockTableRowsHTML(rows){
  return rows.map(({product, entry}) => {
    const flags = stockStatus(entry, product);
    const isLow = flags.some(f => f.type === "low");

    return `
      <tr>
        <td>
          <strong>${esc(product.name)}</strong><br>
          <span class="sku">${esc(product.sku)} ${product.barcode ? '· 🏷️ ' + esc(product.barcode) : ''}</span>
        </td>
        <td><input class="qty-input" type="number" min="0" value="${entry.quantity}" data-product="${product.id}"></td>
        <td>
          <select class="reason-select" data-reason="${product.id}">
            <option value="manual_adjustment">Manual Adjustment</option>
            <option value="physical_reconciliation">Physical Audit Reconciliation</option>
            <option value="damaged_goods">Damaged Goods / Waste</option>
            <option value="expired_disposal">Expired Stock Disposal</option>
            <option value="qc_sample">QC Testing Sample</option>
            <option value="return_to_vendor">Restock Return</option>
          </select>
        </td>
        <td><input class="date-input" type="date" value="${entry.expiry_date || ''}" data-expiry="${product.id}"></td>
        <td><input class="notes-input" type="text" placeholder="Audit note" value="${esc(entry.notes)}" data-notes="${product.id}"></td>
        <td>${flags.map(f=>`<span class="badge ${f.level}">${f.text}</span>`).join(" ") || `<span class="badge ok">Good</span>`}</td>
        <td class="row-actions">
          <button class="save-btn" data-save="${product.id}">Save</button>
          ${isLow ? `<button class="link-btn" data-reorder="${product.id}">Reorder</button>` : ""}
          <button class="link-btn" data-hist-vendor="${entry.vendor_id}" data-hist-product="${product.id}" data-hist-name="${esc(product.name)}">History</button>
        </td>
      </tr>`;
  }).join("");
}

function wireStockTable(tbodyEl, vendorId, afterSave){
  tbodyEl.querySelectorAll("[data-save]").forEach(btn => {
    btn.onclick = async () => {
      const pid = btn.dataset.save;
      const qty = parseInt(tbodyEl.querySelector(`[data-product="${pid}"]`).value || "0", 10);
      const expiry = tbodyEl.querySelector(`[data-expiry="${pid}"]`).value || null;
      const notes = tbodyEl.querySelector(`[data-notes="${pid}"]`).value || null;
      const reasonCode = tbodyEl.querySelector(`[data-reason="${pid}"]`).value || "manual_adjustment";

      btn.disabled = true; btn.textContent = "Saving...";
      const { error } = await sb.from("stock_entries").upsert({
        vendor_id: vendorId, product_id: pid, quantity: qty, expiry_date: expiry, notes: notes
      }, { onConflict: "vendor_id,product_id" });
      
      btn.disabled = false; btn.textContent = "Save";
      if(error){ showToast("Error: " + error.message); }
      else { showToast(`Saved (${reasonCode.replace('_',' ')})`); await loadAll(); afterSave(); }
    };
  });
  tbodyEl.querySelectorAll("[data-reorder]").forEach(btn => {
    btn.onclick = () => openReorderModal(btn.dataset.reorder, vendorId);
  });
  tbodyEl.querySelectorAll("[data-hist-vendor]").forEach(btn => {
    btn.onclick = () => openHistoryModal(btn.dataset.histVendor, btn.dataset.histProduct, btn.dataset.histName);
  });
}

  if(!vendorRow) return [];
  const readIds = new Set(announcementReads.filter(r => r.vendor_id === vendorRow.id).map(r => r.announcement_id));
  return announcements.filter(a => a.is_active && !readIds.has(a.id));
}

  const rows = computeVendorRows(vendorRow.id, true);

  const expiringCount = rows.filter(x => { const d = daysUntil(x.entry.expiry_date); return d !== null && d <= 30; }).length;
  const myRequests = reorderRequests.filter(r => r.vendor_id === vendorRow.id);

  main.innerHTML = `
    ${recalledBatches.length ? `
    <div class="banner banner-recall">
      <div class="banner-head">
        <h3>🛑 URGENT PHARMACEUTICAL BATCH RECALL NOTICE (${recalledBatches.length})</h3>
      </div>
      ${recalledBatches.map(b => {
        const prod = products.find(p => p.id === b.product_id);
        return `<div class="banner-item"><span><strong>${esc(prod?.name)} (Batch: ${esc(b.batch_number)})</strong> — Flagged for immediate quarantine and return. Do not dispense.</span></div>`;
      }).join("")}
    </div>` : ""}

    ${unread.length ? `
    <div class="banner banner-info" id="annBanner">
      <div class="banner-head">
        <h3>📣 ${unread.length} announcement${unread.length>1?'s':''}</h3>
        <button class="dismiss-btn" id="dismissAllAnn">Dismiss all</button>
      </div>
      ${unread.map(a => `
        <div class="banner-item">
          <span><strong>${esc(a.title)}</strong> — ${esc(a.message)}</span>
          <button class="dismiss-btn" data-dismiss-ann="${a.id}">Dismiss</button>
        </div>
      `).join("")}
    </div>` : ""}

    <div class="stat-row">
      <div class="stat"><div class="num">${rows.length}</div><div class="lbl">Products tracked</div></div>
      <div class="stat warn"><div class="num">${lowCount}</div><div class="lbl">Low / out of stock</div></div>
      <div class="stat alert"><div class="num">${expiringCount}</div><div class="lbl">Expiring ≤ 30 days</div></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>Your stock — ${esc(vendorRow.state)}</h2></div>
      <table>
        <thead><tr><th>Product / Barcode</th><th>Quantity</th><th>Reason Code</th><th>Expiry date</th><th>Notes</th><th>Status</th><th></th></tr></thead>
        <tbody id="stockBody"></tbody>
      </table>
      ${rows.length === 0 ? `<div class="empty">No products assigned yet.</div>` : ""}
    </div>
    <div class="panel">
      <div class="panel-head"><h2>Your reorder requests</h2></div>
      <table>
        <thead><tr><th>Product</th><th>Qty requested</th><th>Note</th><th>Status</th><th>Requested</th></tr></thead>
        <tbody id="reqBody"></tbody>
      </table>
      ${myRequests.length === 0 ? `<div class="empty">No reorder requests yet.</div>` : ""}
    </div>
  `;

  if(unread.length){
    document.getElementById("dismissAllAnn").onclick = async () => {
      await sb.from("announcement_reads").upsert(
        unread.map(a => ({ announcement_id: a.id, vendor_id: vendorRow.id })),
        { onConflict: "announcement_id,vendor_id" }
      );
      await loadAll(); renderVendorView();
    };
    main.querySelectorAll("[data-dismiss-ann]").forEach(btn => {
      btn.onclick = async () => {
        await sb.from("announcement_reads").upsert(
          [{ announcement_id: btn.dataset.dismissAnn, vendor_id: vendorRow.id }],
          { onConflict: "announcement_id,vendor_id" }
        );
        await loadAll(); renderVendorView();
      };
    });
  }

  const body = document.getElementById("stockBody");
  body.innerHTML = stockTableRowsHTML(rows);
  wireStockTable(body, vendorRow.id, () => renderVendorView());

  const reqBody = document.getElementById("reqBody");
  myRequests.forEach(r => {
    const product = products.find(p => p.id === r.product_id);
    const tr = document.createElement("tr");
    const statusBadge = r.status === "fulfilled" ? "ok" : r.status === "cancelled" ? "info" : "warn";
    tr.innerHTML = `
      <td>${product ? esc(product.name) : "—"}</td>
      <td>${r.requested_qty}</td>
      <td>${esc(r.note) || "—"}</td>
      <td><span class="badge ${statusBadge}">${r.status}</span></td>
      <td class="sku">${new Date(r.created_at).toLocaleDateString()}</td>
    `;
    reqBody.appendChild(tr);
  });
}

      name, sku, barcode, category, cost_price: cost, selling_price: sell, low_stock_threshold: threshold
    });

    if(error){ showToast("Error: " + error.message); btn.disabled = false; btn.textContent = "Add product"; }
    else { showToast("Product added"); closeModal(); await loadAll(); refreshCurrentView(); }
  };
}

function openVisibilityModal(productId){
  const product = products.find(p => p.id === productId);
  const nonAdminVendors = vendors.filter(v => !v.is_admin);
  const set = visibilityMap[productId];
  const restricted = !!(set && set.size > 0);

  modalRoot.innerHTML = `
    <div class="modal-overlay" id="overlay">
      <div class="modal">
        <button class="modal-close" id="closeX">×</button>
        <h3>Visibility Configuration</h3>
        <p class="modal-sub">${esc(product.name)} · ${esc(product.sku)}</p>
        <label class="radio-row"><input type="radio" name="visMode" value="all" ${!restricted?'checked':''}> Visible to all vendors</label>
        <label class="radio-row"><input type="radio" name="visMode" value="restrict" ${restricted?'checked':''}> Restrict to specific vendors</label>
        <div id="vendorCheckboxes" style="margin:14px 0 6px;${restricted?'':'opacity:.4;pointer-events:none;'}">
          ${nonAdminVendors.map(v => `
            <label class="check-row">
              <input type="checkbox" data-vendor-check="${v.id}" ${set?.has(v.id) ? 'checked':''}> ${esc(v.name)} — ${esc(v.state)}
            </label>
          `).join("")}
        </div>
        <div class="modal-actions">
          <button class="btn-secondary" id="cancelVis">Cancel</button>
          <button class="btn-primary" style="width:auto;" id="saveVis">Save</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById("closeX").onclick = closeModal;
  document.getElementById("cancelVis").onclick = closeModal;
  document.getElementById("overlay").onclick = (e) => { if(e.target.id === "overlay") closeModal(); };

  const checkboxWrap = document.getElementById("vendorCheckboxes");
  modalRoot.querySelectorAll('input[name="visMode"]').forEach(radio => {
    radio.onchange = () => {
      const isRestrict = modalRoot.querySelector('input[name="visMode"]:checked').value === "restrict";
      checkboxWrap.style.opacity = isRestrict ? "1" : ".4";
      checkboxWrap.style.pointerEvents = isRestrict ? "auto" : "none";
    };
  });

  document.getElementById("saveVis").onclick = async () => {
    const mode = modalRoot.querySelector('input[name="visMode"]:checked').value;
    const btn = document.getElementById("saveVis");
    btn.disabled = true; btn.textContent = "Saving...";

    await sb.from("product_visibility").delete().eq("product_id", productId);

    if(mode === "restrict"){
      const selected = [...modalRoot.querySelectorAll("[data-vendor-check]:checked")].map(c => c.dataset.vendorCheck);
      if(selected.length){
        await sb.from("product_visibility").insert(selected.map(vid => ({ product_id: productId, vendor_id: vid })));
      }
    }
    showToast("Visibility updated");
    closeModal();
    await loadAll();
    refreshCurrentView();
  };
}

/* SMART HEADER-AWARE BULK IMPORT PARSER */
function openBulkImportModal(){
  modalRoot.innerHTML = `
    <div class="modal-overlay" id="overlay">
      <div class="modal" style="max-width:750px;">
        <button class="modal-close" id="closeX">×</button>
        <h3>Bulk Import Products</h3>
        <p class="modal-sub">Upload CSV or Excel file (.csv, .xlsx, .xls). Auto-detects Shopify exports, CureForever templates, or custom catalogs.</p>
        <input type="file" id="bulkFile" accept=".csv,.xlsx,.xls">
        <div id="bulkPreviewWrap"></div>
        <div class="modal-actions">
          <button class="btn-secondary" id="cancelBulk">Cancel</button>
          <button class="btn-primary" style="width:auto;" id="confirmBulk" disabled>Import</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById("closeX").onclick = closeModal;
  document.getElementById("cancelBulk").onclick = closeModal;
  document.getElementById("overlay").onclick = (e) => { if(e.target.id === "overlay") closeModal(); };

  let parsedValidRows = [];

  document.getElementById("bulkFile").onchange = async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const previewWrap = document.getElementById("bulkPreviewWrap");
    previewWrap.innerHTML = `<p class="modal-sub">Reading file…</p>`;
    try{
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: "array" });
      const sheetName = wb.SheetNames.includes("Products") ? "Products" : wb.SheetNames[0];
      const sheet = wb.Sheets[sheetName];
      const raw = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });

      if(!raw || raw.length === 0){
        previewWrap.innerHTML = `<p class="err">File is empty.</p>`;
        return;
      }

      // 1. Detect headers from row 0
      const headerRow = (raw[0] || []).map(cell => String(cell || '').trim().toLowerCase());
      
      const findHeaderIndex = (keywords) => {
        return headerRow.findIndex(h => keywords.some(k => h === k || h.includes(k)));
      };

      let idxTitle = findHeaderIndex(["title", "product name", "name"]);
      if (idxTitle === -1) idxTitle = findHeaderIndex(["handle"]);
      
      let idxSku = findHeaderIndex(["variant sku", "sku", "item code", "code"]);
      let idxCategory = findHeaderIndex(["product category", "category", "type", "product type"]);
      let idxCost = findHeaderIndex(["cost per item", "cost price", "cost_price", "cost", "cogs"]);
      let idxSell = findHeaderIndex(["variant price", "price", "selling price", "selling_price", "mrp"]);
      let idxBarcode = findHeaderIndex(["variant barcode", "barcode", "ean", "upc"]);
      let idxThreshold = findHeaderIndex(["low stock threshold", "threshold", "min qty"]);

      // Fallbacks if no header match found (for simple 7-column positional CSVs)
      if (idxTitle === -1) idxTitle = 0;
      if (idxSku === -1) idxSku = 1;
      if (idxCategory === -1) idxCategory = 2;
      if (idxThreshold === -1) idxThreshold = 3;
      if (idxCost === -1) idxCost = 4;
      if (idxSell === -1) idxSell = 5;
      if (idxBarcode === -1) idxBarcode = 6;

      const seenSkus = new Set();
      const parsed = [];

      for(let i = 1; i < raw.length; i++){
        const r = raw[i];
        if(!r || r.every(c => String(c).trim() === "")) continue;

        let name = String(r[idxTitle] ?? "").trim();
        let sku = String(r[idxSku] ?? "").trim();
        let category = String(r[idxCategory] ?? "").trim();
        let barcode = String(r[idxBarcode] ?? "").trim() || null;

        let threshold = safeInt(r[idxThreshold], 10);
        let cost = safeNum(r[idxCost], 0.00);
        let sell = safeNum(r[idxSell], 0.00);

        // If Shopify CSV has empty SKU/Title on extra image attachment lines, skip them cleanly
        if(!sku && !name) continue;
        if(!sku && name){
          // Auto-generate fallback SKU from title if missing
          sku = name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') + '-' + i;
        }

        if(seenSkus.has(sku)){
          // De-dupe: update existing entry with non-empty fields
          const existing = parsed.find(item => item.sku === sku);
          if(existing){
            if(!existing.name && name) existing.name = name;
            if(cost > 0) existing.cost = cost;
            if(sell > 0) existing.sell = sell;
            if(barcode) existing.barcode = barcode;
          }
          continue;
        }

        seenSkus.add(sku);
        parsed.push({ name: name || sku, sku, category, threshold, cost, sell, barcode });
      }

      parsedValidRows = parsed;

      const confirmBtn = document.getElementById("confirmBulk");
      confirmBtn.disabled = parsedValidRows.length === 0;
      confirmBtn.textContent = `Import ${parsedValidRows.length} products`;

      previewWrap.innerHTML = `
        <div class="preview-table-wrap">
          <table>
            <thead><tr><th>Product Name</th><th>SKU</th><th>Category</th><th>Cost (₹)</th><th>Selling (₹)</th><th>Barcode</th></tr></thead>
            <tbody>
              ${parsedValidRows.slice(0, 50).map(r => `
                <tr>
                  <td><strong>${esc(r.name)}</strong></td>
                  <td class="sku">${esc(r.sku)}</td>
                  <td>${esc(r.category) || '—'}</td>
                  <td>${formatCurrency(r.cost)}</td>
                  <td>${formatCurrency(r.sell)}</td>
                  <td class="sku">${esc(r.barcode) || '—'}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
        <p class="modal-sub" style="color:var(--ok);margin-top:8px;">✓ Ready to import ${parsedValidRows.length} valid product items.${parsedValidRows.length > 50 ? ' (Showing first 50 rows preview)' : ''}</p>
      `;
    } catch(err){
      console.error("CSV Parse Error:", err);
      previewWrap.innerHTML = `<p class="err" style="margin-top:10px;">Failed to parse file: ${esc(err.message)}</p>`;
    }
  };

  document.getElementById("confirmBulk").onclick = async () => {
    if(parsedValidRows.length === 0) return;
    const btn = document.getElementById("confirmBulk");
    btn.disabled = true; btn.textContent = "Importing...";

    const payload = parsedValidRows.map(r => ({
      name: r.name || r.sku,
      sku: r.sku,
      category: r.category || null,
      low_stock_threshold: safeInt(r.threshold, 10),
      cost_price: safeNum(r.cost, 0.00),
      selling_price: safeNum(r.sell, 0.00),
      barcode: r.barcode || null
    }));

    const { error } = await sb.from("products").upsert(payload, { onConflict: "sku" });

    if(error){
      console.error("Supabase Import Error:", error);
      showToast("Import failed: " + error.message);
      btn.disabled = false;
      btn.textContent = "Retry Import";
    }
    else {
      showToast(`✓ Successfully imported ${parsedValidRows.length} products!`);
      closeModal();
      await loadAll();
      refreshCurrentView();
    }
  };
}

      <td><strong>${esc(a.title)}</strong></td>

      await sb.from("announcements").update({ is_active: !a.is_active }).eq("id", a.id);
      await loadAll(); renderAdminAnnouncementsTab();
    };
  });
}

/* ============================================================
   11. CSV EXPORT & HISTORY MODAL
   ============================================================ */
function exportCSV(rows){
  const headers = ["Vendor","State","Product","SKU","Barcode","Quantity","Cost Valuation","Expiry Date","Notes","Status"];
  const lines = [headers.join(",")];
  rows.forEach(({entry, product, vendor}) => {
    const flags = stockStatus(entry, product).map(f=>f.text).join(" / ") || "Good";
    const costVal = (entry.quantity * (product.cost_price || 0)).toFixed(2);
    const row = [
      vendor.name, vendor.state, product.name, product.sku, product.barcode || "", entry.quantity, costVal,
      entry.expiry_date || "", (entry.notes || "").replace(/,/g," "), flags
    ].map(v => `"${String(v).replace(/"/g,'""')}"`);
    lines.push(row.join(","));
  });
  const blob = new Blob([lines.join("\n")], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `cureforever-inventory-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showToast("CSV downloaded");
}

        <h3>${esc(productName)}</h3>
        <p class="modal-sub">Quantity History Trend</p>
        <canvas id="historyCanvas" height="220"></canvas>
      </div>
    </div>
  `;
  document.getElementById("closeX").onclick = closeModal;
  document.getElementById("overlay").onclick = (e) => { if(e.target.id === "overlay") closeModal(); };

  const { data } = await sb.from("stock_history")
    .select("*").eq("vendor_id", vendorId).eq("product_id", productId)
    .order("recorded_at", { ascending: true });

  if(!data || data.length === 0){
    document.getElementById("historyCanvas").outerHTML = `<div class="empty">No history points recorded yet.</div>`;
    return;
  }

  const ctx = document.getElementById("historyCanvas").getContext("2d");
  historyChart = new Chart(ctx, {
    type: "line",
    data: {
      labels: data.map(d => new Date(d.recorded_at).toLocaleDateString()),
      datasets: [{
        label: "Quantity",
        data: data.map(d => d.quantity),
        borderColor: "#B8935A",
        backgroundColor: "rgba(184,147,90,0.12)",
        tension: 0.25,
        fill: true,
        pointRadius: 3
      }]
    },
    options: { responsive: true, plugins: { legend: { display: false } } }
  });
}
