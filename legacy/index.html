/* Safe Numeric Helpers to Prevent NaN / Null Violations */
function safeNum(val, defaultVal = 0.0) {
  if (val === null || val === undefined) return defaultVal;
  const s = String(val).replace(/[^0-9.-]/g, '').trim();
  if (!s) return defaultVal;
  const n = parseFloat(s);
  return isNaN(n) ? defaultVal : n;
}

function safeInt(val, defaultVal = 10) {
  if (val === null || val === undefined) return defaultVal;
  const s = String(val).replace(/[^0-9-]/g, '').trim();
  if (!s) return defaultVal;
  const n = parseInt(s, 10);
  return isNaN(n) ? defaultVal : n;
}

/* PWA & Service Worker Registration */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}/* ============================================================
   3. OFFLINE CACHE & SYNC QUEUE
   ============================================================ */
const CACHE_KEY = "cf_cache_v2";
const OFFLINE_OPS_KEY = "cf_offline_ops_v2";

function isOnlineNow(){ return isOnline && navigator.onLine; }

function queueOfflineOp(op){
  let ops = [];
  try { ops = JSON.parse(localStorage.getItem(OFFLINE_OPS_KEY) || "[]"); } catch(e){ ops = []; }
  ops.push(op);
  try { localStorage.setItem(OFFLINE_OPS_KEY, JSON.stringify(ops)); }
  catch(e){ showToast("Offline storage full — change was not saved locally"); }
}

function pendingOfflineOps(){
  try { return JSON.parse(localStorage.getItem(OFFLINE_OPS_KEY) || "[]"); } catch(e){ return []; }
}

async function flushOfflineQueue(){
  const ops = pendingOfflineOps();
  if(!ops.length) return;
  const remaining = [];
  for(const op of ops){
    try {
      if(op.type === "stock_upsert"){
        const { id, ...upd } = op.payload;
        const { error } = await sb.from("stock_entries").update(upd).eq("id", id);
        if(error) throw new Error(error.message);
      } else if(op.type === "reorder"){
        const { error } = await sb.from("reorder_requests").insert(op.payload);
        if(error) throw new Error(error.message);
      } else if(op.type === "announcement_read"){
        const { error } = await sb.from("announcement_reads").upsert(op.payload, { onConflict: "announcement_id,vendor_id" });
        if(error) throw new Error(error.message);
      }
    } catch(e){
      remaining.push(op);
    }
  }
  localStorage.setItem(OFFLINE_OPS_KEY, JSON.stringify(remaining));
  if(remaining.length < ops.length){
    showToast(`✓ Synced ${ops.length - remaining.length} offline change${ops.length - remaining.length > 1 ? 's' : ''}`);
    if(vendorRow){
      await loadAll();
      refreshCurrentView();
    }
  }
}

function cacheState(){
  try {
    localStorage.setItem(CACHE_KEY, JSON.stringify({
      products, productBatches, vendors, stockEntries, stockAdjustments, stockHistory,
      reorderRequests, productVisibility, announcements, announcementReads
    }));
  } catch(e){ /* storage full — ignore */ }
}

function restoreFromCache(){
  const raw = localStorage.getItem(CACHE_KEY);
  if(!raw) return false;
  try {
    const d = JSON.parse(raw);
    products = d.products || [];
    productBatches = d.productBatches || [];
    vendors = d.vendors || [];
    stockEntries = d.stockEntries || [];
    stockAdjustments = d.stockAdjustments || [];
    stockHistory = d.stockHistory || [];
    reorderRequests = d.reorderRequests || [];
    productVisibility = d.productVisibility || [];
    announcements = d.announcements || [];
    announcementReads = d.announcementReads || [];
    rebuildVisibilityMap();
    return true;
  } catch(e){ return false; }
}

function rebuildVisibilityMap(){
  visibilityMap = {};
  productVisibility.forEach(row => {
    if(!visibilityMap[row.product_id]) visibilityMap[row.product_id] = new Set();
    visibilityMap[row.product_id].add(row.vendor_id);
  });
}

function esc(str){
  if(str === null || str === undefined) return "";
  return String(str).replace(/[&<>"']/g, ch => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  }[ch]));
}

function formatCurrency(num){
  return new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 2 }).format(num || 0);
}

function formatDate(dateStr, includeTime = false){
  if(!dateStr) return "Never";
  const d = new Date(dateStr);
  if(isNaN(d.getTime())) return "Never";
  return includeTime ? d.toLocaleString() : d.toLocaleDateString();
}

function daysUntil(dateStr){
  if(!dateStr) return null;
  const today = new Date();
  today.setHours(0,0,0,0);
  const target = new Date(dateStr + "T00:00:00");
  return Math.round((target - today) / (1000*60*60*24));
}

function downloadFile(filename, content, mime){
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

/* ============================================================
   6. REALTIME SYNC
   ============================================================ */
function subscribeRealtime(){
  if(realtimeChannel) return;
  realtimeChannel = sb.channel("inventory-live-v3")
    .on("postgres_changes", { event: "*", schema: "public", table: "stock_entries" }, scheduleRefresh)
    .on("postgres_changes", { event: "*", schema: "public", table: "product_batches" }, scheduleRefresh)
    .on("postgres_changes", { event: "*", schema: "public", table: "stock_adjustments" }, scheduleRefresh)
    .on("postgres_changes", { event: "*", schema: "public", table: "reorder_requests" }, scheduleRefresh)
    .on("postgres_changes", { event: "*", schema: "public", table: "vendors" }, scheduleRefresh)
    .on("postgres_changes", { event: "*", schema: "public", table: "products" }, scheduleRefresh)
    .on("postgres_changes", { event: "*", schema: "public", table: "product_visibility" }, scheduleRefresh)
    .on("postgres_changes", { event: "*", schema: "public", table: "announcements" }, scheduleRefresh)
    .on("postgres_changes", { event: "*", schema: "public", table: "announcement_reads" }, scheduleRefresh)
    .subscribe();
}
function unsubscribeRealtime(){
  if(realtimeChannel){ sb.removeChannel(realtimeChannel); realtimeChannel = null; }
}
function scheduleRefresh(){
  if(refreshPending) return;
  refreshPending = true;
  setTimeout(async () => {
    refreshPending = false;
    const active = document.activeElement;
    const isTyping = active && (active.tagName === "INPUT" || active.tagName === "TEXTAREA" || active.tagName === "SELECT");
    const modalOpen = modalRoot.innerHTML.trim() !== "";
    if(isTyping || modalOpen){ scheduleRefresh(); return; }
    if(!vendorRow || !document.getElementById("main")) return;
    await loadAll();
    refreshCurrentView();
    flashLiveIndicator();
  }, 800);
}
function flashLiveIndicator(){
  const el = document.getElementById("liveDot");
  if(!el) return;
  el.classList.add("pulse");
  clearTimeout(liveIndicatorTimer);
  liveIndicatorTimer = setTimeout(() => el.classList.remove("pulse"), 1200);
}
function refreshCurrentView(){
  if(!vendorRow) return;
  if(vendorRow.is_admin) renderAdminView();
  else renderVendorView();
}

/* ============================================================
   7. DATA LOADING (with offline cache fallback)
   ============================================================ */
async function loadAll(){
  try {
    const [p, pb, v, s, sa, sh, r, pv, an, ar] = await Promise.all([
      sb.from("products").select("*").order("name"),
      sb.from("product_batches").select("*").order("expiry_date"),
      sb.from("vendors").select("*").order("state"),
      sb.from("stock_entries").select("*"),
      sb.from("stock_adjustments").select("*").order("created_at", { ascending: false }).limit(150),
      sb.from("stock_history").select("*").order("recorded_at", { ascending: false }).limit(500),
      sb.from("reorder_requests").select("*").order("created_at", { ascending: false }),
      sb.from("product_visibility").select("*"),
      sb.from("announcements").select("*").order("created_at", { ascending: false }),
      sb.from("announcement_reads").select("*")
    ]);
    if([p, pb, v, s, sa, sh, r, pv, an, ar].some(res => res.error)) throw new Error("partial-load-failure");

    products = p.data || [];
    productBatches = pb.data || [];
    vendors = v.data || [];
    stockEntries = s.data || [];
    stockAdjustments = sa.data || [];
    stockHistory = sh.data || [];
    reorderRequests = r.data || [];
    productVisibility = pv.data || [];
    announcements = an.data || [];
    announcementReads = ar.data || [];
    rebuildVisibilityMap();
    cacheState();
    if(offlineMode){
      offlineMode = false;
      showToast("🌐 Live data restored");
    }
  } catch(e){
    if(!offlineMode){
      const ok = restoreFromCache();
      if(ok){
        offlineMode = true;
        showToast("⚠️ Offline mode — showing last synced data");
      }
    } else {
      restoreFromCache();
    }
  }
  refreshExpiredBatches();
}

/* Auto-flag batches whose expiry date has passed */
function refreshExpiredBatches(){
  try {
    const expiredIds = productBatches
      .filter(b => b.status === "active" && b.expiry_date && daysUntil(b.expiry_date) < 0)
      .map(b => b.id);
    if(expiredIds.length){
      sb.from("product_batches").update({ status: "expired" }).in("id", expiredIds).then(({ error }) => {
        if(!error){
          productBatches.forEach(b => { if(expiredIds.includes(b.id)) b.status = "expired"; });
        }
      }).catch(() => {});
    }
  } catch(e){ /* ignore */ }
}

function stockStatus(product, qty){
  if(qty <= 0) return "out";
  if(qty <= product.low_stock_threshold) return "low";
  return "in";
}

function rankStatus(r){
  return stockStatus(r.product, r.entry.quantity) === "out" ? 0 : (stockStatus(r.product, r.entry.quantity) === "low" ? 1 : 2);
}

function batchDisplayStatus(b){
  if(b.status === "recalled") return "Recalled";
  if(b.expiry_date && daysUntil(b.expiry_date) < 0) return "Expired";
  const diff = b.expiry_date ? daysUntil(b.expiry_date) : null;
  if(diff !== null && diff <= 30) return "Expiring Soon";
  return "Active";
}
function batchStatusBadge(status){
  const cls = status === "Active" ? "ok" : status === "Expired" ? "danger" : status === "Recalled" ? "danger" : "warn";
  return `<span class="badge ${cls}">${status.toUpperCase()}</span>`;
}

function isProductVisible(productId, vendorId){
  const set = visibilityMap[productId];
  return !set || set.size === 0 || set.has(vendorId);

async function markAnnouncementRead(announcementId){
  if(!isOnlineNow()){
    queueOfflineOp({ type: "announcement_read", payload: { announcement_id: announcementId, vendor_id: vendorRow.id } });
    return;
  }
  await sb.from("announcement_reads").upsert(
    [{ announcement_id: announcementId, vendor_id: vendorRow.id }],
    { onConflict: "announcement_id,vendor_id" }
  );

function renderAlertsBody(){
  const isAdmin = vendorRow?.is_admin;
  const body = document.getElementById("alertsBody");
  if(!body) return;
  let html = `<div class="alert-list">`;

  if(isAdmin){
    const pending = reorderRequests.filter(r => r.status === "pending");
    if(pending.length){
      html += `<div style="font-weight:700;color:var(--navy);font-size:13px;margin:6px 0 10px;">📦 Pending Reorder Requests (${pending.length})</div>`;
      pending.slice(0, 20).forEach(r => {
        const vendor = vendors.find(v => v.id === r.vendor_id);
        const product = products.find(p => p.id === r.product_id);
        html += `<div class="alert-item alert-warn">
          <div><div class="alert-title">${esc(product?.name || "Product")}</div>
          <div class="alert-meta">${esc(vendor?.name || "—")} · Qty ${r.requested_qty} · ${esc(r.note || "No note")} · ${new Date(r.created_at).toLocaleString()}</div></div>
          <div class="alert-actions" style="justify-content:flex-end;">
            <button class="save-btn" data-fulfill="${r.id}">Fulfill</button>
            <button class="link-btn danger-link" data-cancel-req="${r.id}">Cancel</button>
          </div>
        </div>`;
      });
    }
  } else {
    const myPending = reorderRequests.filter(r => r.vendor_id === vendorRow.id && r.status === "pending");
    if(myPending.length){
      html += `<div style="font-weight:700;color:var(--navy);font-size:13px;margin:6px 0 10px;">📦 Your Pending Reorders (${myPending.length})</div>`;
      myPending.forEach(r => {
        const product = products.find(p => p.id === r.product_id);
        html += `<div class="alert-item alert-warn">
          <div><div class="alert-title">${esc(product?.name || "Product")}</div>
          <div class="alert-meta">Qty ${r.requested_qty} · ${esc(r.note || "No note")} · ${new Date(r.created_at).toLocaleString()}</div></div>
          <div class="alert-actions" style="justify-content:flex-end;">
            <button class="link-btn danger-link" data-cancel-req="${r.id}">Cancel request</button>
          </div>
        </div>`;
      });
    }
  }

  const lowItems = isAdmin
    ? stockEntries.map(e => ({ entry: e, product: products.find(p => p.id === e.product_id), vendor: vendors.find(v => v.id === e.vendor_id) }))
        .filter(r => r.product && r.vendor && r.entry.quantity <= r.product.low_stock_threshold)
        .sort((a,b) => a.entry.quantity - b.entry.quantity).slice(0, 15)
    : computeVendorRows(vendorRow.id, true).filter(r => r.entry.quantity <= r.product.low_stock_threshold).slice(0, 15);

  if(lowItems.length){
    html += `<div style="font-weight:700;color:var(--navy);font-size:13px;margin:14px 0 10px;">⚠️ Low / Out of Stock (${lowItems.length}${isAdmin ? ' shown' : ''})</div>`;
    lowItems.forEach(r => {
      const badge = r.entry.quantity <= 0 ? "danger" : "warn";
      html += `<div class="alert-item ${badge === 'danger' ? 'alert-danger' : 'alert-warn'}">
        <div><div class="alert-title">${esc(r.product.name)}</div>
        <div class="alert-meta">${isAdmin ? esc(r.vendor?.name || "") + " · " : ""}Quantity: <strong>${r.entry.quantity}</strong> / threshold ${r.product.low_stock_threshold} · ${esc(r.product.sku)}</div></div>
        <div class="alert-actions" style="justify-content:flex-end;">
          <button class="link-btn" data-jump-low="${r.product.id}">View</button>
        </div>
      </div>`;
    });
  } else {
    html += `<div style="font-weight:700;color:var(--ok);font-size:13px;margin:6px 0 10px;">✅ No low-stock alerts</div>`;
  }

  const unread = activeUnreadAnnouncements();
  if(unread.length){
    html += `<div style="font-weight:700;color:var(--navy);font-size:13px;margin:14px 0 10px;">📣 Unread Announcements (${unread.length})</div>`;
    unread.forEach(a => {
      html += `<div class="alert-item">
        <div><div class="alert-title">${esc(a.title)}</div>
        <div class="alert-meta">${esc(a.message)}<br>${new Date(a.created_at).toLocaleString()}</div></div>
        <div class="alert-actions" style="justify-content:flex-end;">
          <button class="dismiss-btn" data-dismiss-ann="${a.id}">Mark read</button>
        </div>
      </div>`;
    });
  }

  html += `</div>`;
  body.innerHTML = html;

  if(isAdmin){
    body.querySelectorAll("[data-fulfill]").forEach(btn => {
      btn.onclick = async () => {
        await sb.from("reorder_requests").update({ status: "fulfilled", resolved_at: new Date().toISOString() }).eq("id", btn.dataset.fulfill);
        await loadAll(); renderAlertsBody(); updateHeaderBell();
      };
    });
  }
  body.querySelectorAll("[data-cancel-req]").forEach(btn => {
    btn.onclick = async () => {
      await sb.from("reorder_requests").update({ status: "cancelled", resolved_at: new Date().toISOString() }).eq("id", btn.dataset.cancelReq);
      await loadAll(); renderAlertsBody(); updateHeaderBell();
    };
  });
  body.querySelectorAll("[data-dismiss-ann]").forEach(btn => {
    btn.onclick = async () => {
      await markAnnouncementRead(btn.dataset.dismissAnn);
      await loadAll(); renderAlertsBody(); updateHeaderBell();
    };
  });
  body.querySelectorAll("[data-jump-low]").forEach(btn => {
    btn.onclick = () => {
      if(!isAdmin) return;
      closeModal();
      adminTab = "allstock";
      adminSearch = products.find(p => p.id === btn.dataset.jumpLow)?.sku || "";
      renderAdminView();
    };
  });
}

function computeVendorRows(vendorId, minOnly){
  const rows = [];
  stockEntries.forEach(e => {
    if(e.vendor_id !== vendorId) return;
    const product = products.find(p => p.id === e.product_id);
    if(!product || !e.batch_id) return;
    if(vendorId && !isProductVisible(product.id, vendorId)) return;
    const batch = productBatches.find(b => b.id === e.batch_id);
    rows.push({ entry: e, product, batch });
  });
  if(minOnly) return rows;
  rows.sort((a,b) => {
    if(sortKey === "name") return (a.product.name || "").localeCompare(b.product.name || "");
    if(sortKey === "sku") return (a.product.sku || "").localeCompare(b.product.sku || "");
    if(sortKey === "qty") return a.entry.quantity - b.entry.quantity;
    if(sortKey === "expiry") return (a.batch?.expiry_date || "9999").localeCompare(b.batch?.expiry_date || "9999");
    if(sortKey === "low") return rankStatus(a) - rankStatus(b);
    return (a.product.name || "").localeCompare(b.product.name || "");
  });
  if(sortDir === "desc") rows.reverse();
  return rows;
}

function batchOptionsForProduct(productId){
  return productBatches.filter(b => b.product_id === productId).sort((a,b) =>

}

async function persistStockEntry(row, changes){
  const p = row.product;
  const updateData = {
    id: row.entry.id,
    quantity: changes.quantity,
    reason_code: changes.reason_code,
    notes: changes.notes
  };
  if(changes.expiry) updateData.expiry_date = changes.expiry;
  if(changes.batch_id !== undefined) updateData.batch_id = changes.batch_id;

  if(!isOnlineNow()){
    queueOfflineOp({ type: "stock_upsert", payload: updateData });
    updateRowInState(row.entry.id, { quantity: updateData.quantity, reason_code: updateData.reason_code, notes: updateData.notes, expiry_date: updateData.expiry_date, batch_id: updateData.batch_id });
    showToast("📴 Offline — saved locally (will auto-sync)");
    return;
  }
  const { error } = await sb.from("stock_entries").update(updateData).eq("id", row.entry.id);
  if(!error){
    await loadAll();
    showToast(`✓ ${p.name} updated for audit`);
  } else {
    showToast("Error: " + error.message);
  }
}

function updateRowInState(entryId, updates){
  const i = stockEntries.findIndex(e => e.id === entryId);
  if(i < 0) return;
  stockEntries[i] = { ...stockEntries[i], ...updates };
}

function wireStockTable(tbodyEl, context){
  tbodyEl.querySelectorAll("[data-product], [data-notes], [data-expiry], [data-reason]").forEach(inp => {
    inp.addEventListener("keydown", (e) => {
      if(e.key === "Enter"){
        e.preventDefault();
        const btn = tbodyEl.querySelector(`[data-save="${inp.dataset.product || inp.dataset.notes || inp.dataset.expiry || inp.dataset.reason}"]`);
        if(btn) btn.click();
      }
    });
  });

  tbodyEl.querySelectorAll("[data-save]").forEach(btn => {
    btn.onclick = async () => {
      const pid = btn.dataset.save;
      const row = getEditableRowForProduct(tbodyEl, pid);
      if(!row) return;
      btn.disabled = true; btn.textContent = "Saving...";

      const root = tbodyEl.querySelector(`tr[data-pid="${pid}"]`) || btn.closest("tr");
      const qtyEl = tbodyEl.querySelector(`[data-product="${pid}"]`);
      const reasonEl = tbodyEl.querySelector(`[data-reason="${pid}"]`);
      const expiryEl = tbodyEl.querySelector(`[data-expiry="${pid}"]`);
      const notesEl = tbodyEl.querySelector(`[data-notes="${pid}"]`);
      const batchEl = tbodyEl.querySelector(`[data-batch="${pid}"]`);

      const changes = {
        quantity: parseFloat(qtyEl ? qtyEl.value : row.entry.quantity) ?? row.entry.quantity,
        reason_code: reasonEl ? reasonEl.value : row.entry.reason_code,
        notes: notesEl ? notesEl.value : row.entry.notes
      };
      if(expiryEl) changes.expiry = expiryEl.value || null;
      if(batchEl){
        const text = batchEl.value.trim();
        if(text){
          const matching = productBatches.find(b =>
            b.product_id === pid &&
            (b.batch_number.toLowerCase() === text.toLowerCase() ||
             b.id.toLowerCase() === text.toLowerCase())
          );
          if(matching){
            changes.batch_id = matching.id;
          } else {
            changes.batch_id = null;
            showToast("⚠️ Batch not found — stock will show unlinked until a matching batch is added");
          }
        }
      }
      await persistStockEntry(row, changes);
      btn.disabled = false; btn.textContent = "Save";
    };
  });

  tbodyEl.querySelectorAll("[data-history]").forEach(btn => {
    btn.onclick = () => openHistoryModal(btn.dataset.history, context === "admin" ? null : vendorRow.id);
  });

  tbodyEl.querySelectorAll("[data-reorder]").forEach(btn => {
    btn.onclick = async () => {
      const count = (await sb.from("reorder_requests").select("id").eq("product_id", btn.dataset.reorder).eq("vendor_id", vendorRow.id).eq("status", "pending")).data?.length || 0;
      if(count > 0){ showToast("A reorder request for this product is already pending"); return; }
      openReorderModal(btn.dataset.reorder);
    };
  });
}

function getEditableRowForProduct(tbodyEl, pid){
  const rows = tbodyEl.__cfRows || [];
  return rows.find(r => r.product.id === pid);
}

function computeVendorStats(vendorId){
  const rows = computeVendorRows(vendorId);
  let totalQty = 0, value = 0;
  const today = new Date();
  let expiringSoon = 0, expired = 0;
  rows.forEach(r => {
    totalQty += r.entry.quantity;
    value += r.entry.quantity * (r.product.selling_price || 0);
    if(r.batch?.expiry_date){
      const diff = daysUntil(r.batch.expiry_date);
      if(diff < 0) expired++;
      else if(diff <= 180) expiringSoon++;
    }
  });
  return {
    totalQty,
    totalProducts: rows.length,
    expiringSoon,
    expired,
    value
  };
}

/* ============================================================

   ============================================================ */
function openReorderModal(productId){
  const product = products.find(p => p.id === productId);
  if(!product) return;
  const myRow = computeVendorRows(vendorRow.id).find(r => r.product.id === productId);
  const current = myRow ? myRow.entry.quantity : 0;
  const suggested = Math.max(product.reorder_threshold * 2 - current, product.reorder_threshold);
  const latestBatch = productBatches
    .filter(b => b.product_id === productId)
    .sort((a,b) => (b.expiry_date || "9999").localeCompare(a.expiry_date || "9999"))[0];

  modalRoot.innerHTML = `
    <div class="modal-overlay" id="overlay">
      <div class="modal">
        <button class="modal-close" id="closeX">×</button>
        <h3>📦 Reorder — ${esc(product.name)}</h3>
        <p class="modal-sub">${esc(product.sku)} · Current stock ${current} · Threshold ${product.reorder_threshold}</p>
        <label>Quantity to request</label>
        <input id="reqQty" type="number" min="1" value="${suggested}">
        <p class="mini-stat-note">Suggested: ${suggested} units (${product.reorder_threshold * 2} − current ${current})</p>
        ${latestBatch ? `<p class="mini-stat-note">Latest batch on file: <strong>${esc(latestBatch.batch_number)}</strong> (exp ${latestBatch.expiry_date ? latestBatch.expiry_date.slice(0,10) : "—"})</p>` : `<p class="mini-stat-note">No batch on file yet.</p>`}
        <label>Note for admin (optional)</label>
        <input id="reqNote" type="text" placeholder="e.g. Urgent — high daily demand">
        <div class="modal-actions">
          <button class="btn-secondary" id="cancelReq">Cancel</button>
          <button class="btn-primary" style="width:auto;" id="sendReq">Send Reorder Request</button>
        </div>
      </div>
    </div>
  `;
  bindModalClose(["closeX","cancelReq"]);

  document.getElementById("sendReq").onclick = async () => {
    const qty = parseInt(document.getElementById("reqQty").value, 10);
    const note = document.getElementById("reqNote").value.trim() || null;
    if(!qty || qty < 1){ showToast("Enter a valid quantity (minimum 1)"); return; }
    const payload = {
      vendor_id: vendorRow.id,
      product_id: productId,
      batch_id: latestBatch?.batch_id || null,
      requested_qty: qty,
      note,
      status: "pending"
    };
    if(!isOnlineNow()){
      queueOfflineOp({ type: "reorder", payload });
      showToast("📴 Offline — reorder queued, will auto-send when online");
      closeModal();
      return;
    }
    const { error } = await sb.from("reorder_requests").insert(payload);
    if(error){ showToast("Error: " + error.message); return; }
    showToast("✓ Reorder request sent to admin");
    closeModal();
    await loadAll(); updateHeaderBell();
  };
}

    <div id="tabContent"></div>
  `;

  existing.querySelectorAll(".tab-btn").forEach(btn => {
    btn.onclick = () => {
      adminTab = btn.dataset.tab;
      renderAdminView();
    };
  });

  const content = document.getElementById("tabContent");
  switch(adminTab){
    case "vendors": renderAdminByVendorTab(content); break;
    case "allstock": renderAdminAllStockTab(content); break;
    case "batches": renderAdminBatchesTab(content); break;
    case "financials": renderAdminFinancialsTab(content); break;
    case "products": renderAdminProductsTab(content); break;
    case "announcements": renderAdminAnnouncementsTab(content); break;
    default: renderAdminDashboardTab(content);
  }
}

function destroyDashboardCharts(){
  ["chartLowVendor","chartExpiry","chartTrend","chartValueTop"].forEach(id => {
    const canvas = document.getElementById(id);
    if(canvas && dashboardCharts[id]){ dashboardCharts[id].destroy(); dashboardCharts[id] = null; }

}

      html += `<tr>
        <td><strong>${esc(r.product.name)}</strong><br><span class="muted">${esc(r.product.sku)}</span></td>
        <td>${esc(r.entry.vendor_id ? (vendors.find(v => v.id === r.entry.vendor_id)?.name || "—") : "—")}</td>

    tbl.innerHTML = html;

      const data = rows.map(r => ({

        Vendor: r.entry.vendor_id ? (vendors.find(v => v.id === r.entry.vendor_id)?.name || "") : "",
        Quantity: r.entry.quantity, "Low Stock Threshold": r.product.low_stock_threshold,
        "Reorder Level": r.product.reorder_threshold
      }));

    };

  drawLow();

  const drawExpiry = () => {
    const tbl = document.getElementById("expiryTbl");
    if(!tbl) return;
    let html = `<thead><tr><th>Batch</th><th>Product</th><th>Expiry Date</th><th>Days Left</th><th>Status</th></tr></thead><tbody>`;
    expiring.slice(0, 40).forEach(r => {
      const status = r.diff < 0 ? "Expired" : (r.diff <= 30 ? "Expiring soon" : "Watch");
      const cls = r.diff < 0 ? "badge-danger" : (r.diff <= 30 ? "badge-warn" : "badge-ok");
      html += `<tr>

  };
  drawExpiry();

  /* ---- Charts ---- */
  const chartLowData = vendors.map(v => {
    const count = rows.filter(r => r.entry.vendor_id === v.id).length;
    return { label: (v.state || v.name).slice(0, 14), count };
  }).filter(d => d.count > 0);

  const now = new Date();
  const expBuckets = { "Expired": 0, "0-30d": 0, "31-90d": 0, "91-180d": 0, "Safe (>180d)": 0 };
  productBatches.forEach(b => {
    if(!b.expiry_date || b.status === "recalled"){ return; }
    const diff = daysUntil(b.expiry_date);
    if(diff < 0) expBuckets["Expired"]++;
    else if(diff <= 30) expBuckets["0-30d"]++;
    else if(diff <= 90) expBuckets["31-90d"]++;
    else if(diff <= 180) expBuckets["91-180d"]++;
    else expBuckets["Safe (>180d)"]++;
  });

  const trendData = [];
  for(let i = 13; i >= 0; i--){
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    trendData.push({ key, date: d, total: 0 });
  }
  const dayIndex = {};
  trendData.forEach((t, i) => { dayIndex[t.key] = i; });
  const histByKey = {};
  stockHistory.forEach(h => {
    const k = h.vendor_id + "|" + h.product_id;
    if(!histByKey[k]) histByKey[k] = [];
    histByKey[k].push(h);
  });
  Object.values(histByKey).forEach(seq => {
    seq.sort((a,b) => new Date(a.recorded_at) - new Date(b.recorded_at));
    seq.forEach((h, i) => {
      if(!h.recorded_at) return;
      const key = h.recorded_at.slice(0, 10);
      if(!(key in dayIndex)) return;
      const delta = (i === 0) ? h.quantity : h.quantity - seq[i-1].quantity;
      trendData[dayIndex[key]].total += delta;
    });
  });

  const topValue = stockEntries
    .map(e => ({ entry: e, product: products.find(p => p.id === e.product_id) }))
    .filter(r => r.product)
    .reduce((acc, r) => {
      const existing = acc.find(a => a.product.id === r.product.id);
      if(existing) existing.value += r.entry.quantity * (r.product.selling_price || 0);
      else acc.push({ product: r.product, value: r.entry.quantity * (r.product.selling_price || 0) });
      return acc;
    }, [])
    .sort((a,b) => b.value - a.value)
    .slice(0, 8);

  const palette = ["#0F1F3D","#B3261E","#C9A227","#2E7D5B","#6B7280","#8B5CF6","#0E7490","#B45309"];

  try {
    if(chartLowData.length){

        data: { labels: chartLowData.map(d => d.label), datasets: [{ label: "Low stock lines", data: chartLowData.map(d => d.count), backgroundColor: "#C9A227" }] },
        options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } }
      });
    }

    dashboardCharts.chartExpiry = new Chart(document.getElementById("chartExpiry"), {
      type: "doughnut",
      data: { labels: Object.keys(expBuckets), datasets: [{ data: Object.values(expBuckets), backgroundColor: ["#B3261E","#E8612D","#C9A227","#8B5CF6","#2E7D5B"] }] },
      options: { responsive: true, plugins: { legend: { position: "right", labels: { font: { size: 11, family: "Inter" } } } } }
    });

    dashboardCharts.chartTrend = new Chart(document.getElementById("chartTrend"), {
      type: "line",
      data: {
        labels: trendData.map(t => `${t.date.getDate()}/${t.date.getMonth()+1}`),
        datasets: [{ label: "Net stock change", data: trendData.map(t => t.total), borderColor: "#0F1F3D", backgroundColor: "rgba(15,31,61,0.08)", fill: true, tension: 0.35, pointRadius: 2 }]
      },
      options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
    });

    if(topValue.length){
      dashboardCharts.chartValueTop = new Chart(document.getElementById("chartValueTop"), {
        type: "bar",
        data: { labels: topValue.map(t => t.product.name.length > 16 ? t.product.name.slice(0,16) + "…" : t.product.name), datasets: [{ label: "Value (₹)", data: topValue.map(t => t.value), backgroundColor: topValue.map((_,i) => palette[i % palette.length]) }] },
        options: { responsive: true, indexAxis: "y", plugins: { legend: { display: false } } }
      });
    }
  } catch(e) {
    console.error("Chart render error:", e);
  }

  /* ---- Recent adjustments ---- */
  const adjEl = document.getElementById("adjTbl");
  const adjNote = document.getElementById("adjNote");
  const recent = [...stockAdjustments].sort((a,b) => new Date(b.created_at) - new Date(a.created_at)).slice(0, 25);
  adjNote.textContent = recent.length ? "Latest vendor-invoked stock adjustments." : "No adjustments recorded yet.";
  if(recent.length){
    let html = `<thead><tr><th>Date</th><th>Product</th><th>Vendor</th><th>Reason</th><th>Old Qty</th><th>New Qty</th><th>Notes</th></tr></thead><tbody>`;
    recent.forEach(a => {
      const p = products.find(pr => pr.id === a.product_id);
      const v = vendors.find(vd => vd.id === a.vendor_id);
      html += `<tr>
        <td>${new Date(a.created_at).toLocaleString()}</td>
        <td>${esc(p?.name || "—")}</td>
        <td>${esc(v?.name || "—")}</td>
        <td>${labelForReason(a.reason_code)}</td>
        <td>${a.previous_qty}</td>
        <td>${a.new_qty}</td>
        <td>${esc(a.notes || "—")}</td>
      </tr>`;
    });
    html += "</tbody>";
    adjEl.innerHTML = html;
  }
  document.getElementById("exportAdjBtn").onclick = () => exportAuditCSV();
}

function computeVendorRowsAll(){
  const rows = [];
  stockEntries.forEach(e => {
    const product = products.find(p => p.id === e.product_id);
    const vendor = vendors.find(v => v.id === e.vendor_id);
    if(!product || !vendor || !e.batch_id) return;
    const batch = productBatches.find(b => b.id === e.batch_id);
    rows.push({ entry: e, product, vendor, batch });
  });
  return rows;
}/* ---- 13b. Admin: Per-Vendor Tab ---- */

async function deleteVendor(vendor){
  const hasStock = stockEntries.some(e => e.vendor_id === vendor.id);
  const msg = hasStock
    ? `"${vendor.name}" still has stock lines on record. Deleting will remove vendor access. Stock history remains in the immutable audit log.`
    : `"${vendor.name}" has no stock lines. Deleting removes vendor access and their profile.`;
  if(!confirm(`Delete vendor account "${vendor.name}"?\n\n${msg}\n\nTo fully remove the login, also delete the Supabase Auth user for ${vendor.email || "this vendor"} from Dashboard → Authentication → Users.`)) return;

  const { error } = await sb.from("vendors").delete().eq("id", vendor.id);
  if(error){ showToast("Error: " + error.message); return; }
  showToast("✓ Vendor deleted");
  await loadAll();
  adminVendorTabId = vendors[0]?.id || null;
  renderAdminView();
}

/* ---- 13c. Admin: All Stock Tab ---- */
function allStockRowsCombined(){
  const rows = [];
  stockEntries.forEach(e => {
    const product = products.find(p => p.id === e.product_id);
    const vendor = vendors.find(v => v.id === e.vendor_id);
    if(!product || !vendor) return;
    const batch = e.batch_id ? productBatches.find(b => b.id === e.batch_id) : null;
    rows.push({ entry: e, product, vendor, batch });
  });
  return rows;
}

function sortableThRow(sortedRows, hasCategory){
  return `
    <tr>
      <th>#</th>
      <th class="sortable" data-sort="name">Product ${sortKey === "name" ? (sortDir === "asc" ? "▲" : "▼") : ""}</th>
      ${hasCategory ? `<th class="sortable" data-sort="category">Category ${sortKey === "category" ? (sortDir === "asc" ? "▲" : "▼") : ""}</th>` : ""}
      <th>Vendor</th>
      <th class="sortable" data-sort="qty">Quantity ${sortKey === "qty" ? (sortDir === "asc" ? "▲" : "▼") : ""}</th>
      <th>Reason</th>
      <th>Batch</th>
      <th class="sortable" data-sort="expiry">Expiry ${sortKey === "expiry" ? (sortDir === "asc" ? "▲" : "▼") : ""}</th>
      <th>Notes</th>
      <th>History</th>
    </tr>
  `;
}

function renderAdminAllStockTab(content){
  content.innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <h2>All Stock — ${categoryFilter === "all" ? "All Categories" : categoryFilter}</h2>
        <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
          <input class="search-input" id="allSearchInput" placeholder="🔍 Search product, SKU, vendor, batch…" value="">
          <select id="categoryFilterSel" class="reason-select" style="width:auto;">
            <option value="all">All Categories</option>
            <option value="vitamins">Vitamins & Supplements</option>
            <option value="medicines">Medicines</option>
            <option value="herbal">Herbal & Ayurvedic</option>
            <option value="personal">Personal Care</option>
          </select>
          <button class="export-btn no-print" id="exportCsvBtn">⬇ CSV</button>
          <button class="export-btn no-print" id="exportXlsxBtn">⬇ Excel</button>
          <button class="export-btn alt no-print" id="exportPrintBtn">🖨 Print</button>
        </div>
      </div>
      <div class="chips-row">
        <button class="chip ${activeFilter === "all" ? "active" : ""}" data-filter="all">All</button>
        <button class="chip ${activeFilter === "instock" ? "active" : ""}" data-filter="instock">In Stock</button>
        <button class="chip ${activeFilter === "out" ? "active" : ""}" data-filter="out">Out of Stock</button>
        <button class="chip ${activeFilter === "low" ? "active" : ""}" data-filter="low">Low Stock</button>
        <button class="chip ${activeFilter === "expiring" ? "active" : ""}" data-filter="expiring">Expiring ≤180d</button>
        <button class="chip ${activeFilter === "expired" ? "active" : ""}" data-filter="expired">Expired</button>
      </div>
      <p class="mini-stat-note" id="allStockCount"></p>
      <div style="overflow-x:auto;">
        <table class="ftable" id="allStockTbl"></table>
      </div>
    </div>
  `;

  content.querySelectorAll("[data-filter]").forEach(chip => {
    chip.onclick = () => {
      activeFilter = chip.dataset.filter;
      renderAdminAllStockTab(content);
    };
  });

  document.getElementById("allSearchInput").value = adminSearch;
  document.getElementById("categoryFilterSel").value = categoryFilter;

  const draw = () => {
    let rows = allStockRowsCombined();
    if(categoryFilter !== "all") rows = rows.filter(r => (r.product.category || "") === categoryFilter);
    if(activeFilter === "instock") rows = rows.filter(r => r.entry.quantity > r.product.low_stock_threshold);
    else if(activeFilter === "out") rows = rows.filter(r => r.entry.quantity <= 0);
    else if(activeFilter === "low") rows = rows.filter(r => r.entry.quantity > 0 && r.entry.quantity <= r.product.low_stock_threshold);
    else if(activeFilter === "expiring") rows = rows.filter(r => r.batch?.expiry_date && daysUntil(r.batch.expiry_date) >= 0 && daysUntil(r.batch.expiry_date) <= 180);
    else if(activeFilter === "expired") rows = rows.filter(r => r.batch?.expiry_date && daysUntil(r.batch.expiry_date) < 0);

    const q = adminSearch.trim().toLowerCase();
    if(q){
      rows = rows.filter(r =>
        (r.product.name || "").toLowerCase().includes(q) ||
        (r.product.sku || "").toLowerCase().includes(q) ||
        (r.vendor.name || "").toLowerCase().includes(q) ||
        (r.vendor.state || "").toLowerCase().includes(q) ||
        (r.batch?.batch_number || "").toLowerCase().includes(q)
      );
    }

    switch(sortKey){
      case "name": rows.sort((a,b) => (a.product.name || "").localeCompare(b.product.name || "")); break;
      case "category": rows.sort((a,b) => (a.product.category || "").localeCompare(b.product.category || "")); break;
      case "qty": rows.sort((a,b) => a.entry.quantity - b.entry.quantity); break;
      case "expiry": rows.sort((a,b) => (a.batch?.expiry_date || "9999").localeCompare(b.batch?.expiry_date || "9999")); break;
    }
    if(sortDir === "desc") rows.reverse();

    document.getElementById("allStockCount").textContent = `${rows.length} stock lines shown (of ${stockEntries.length} total).`;

    const tbl = document.getElementById("allStockTbl");
    const hasCategory = categoryFilter === "all";
    if(!rows.length){
      tbl.innerHTML = `${sortableThRow(rows, hasCategory)}<tbody><tr><td colspan="10" style="text-align:center;color:#6B7280;padding:28px;">No stock lines match the current filters.</td></tr></tbody>`;
    } else {
      let html = sortableThRow(rows, hasCategory) + `<tbody>`;
      rows.forEach((r, i) => {
        const status = stockStatus(r.product, r.entry.quantity);
        const badge = status === "out" ? "badge-danger" : (status === "low" ? "badge-warn" : "badge-ok");
        const statusLabel = status === "out" ? "Out of Stock" : (status === "low" ? "Low Stock" : "In Stock");
        const expired = r.batch?.expiry_date && daysUntil(r.batch.expiry_date) < 0;
        html += `<tr class="${expired ? 'row-danger' : ''}">
          <td>${i + 1}</td>
          <td><strong>${esc(r.product.name)}</strong><br><span class="muted">${esc(r.product.sku)}</span></td>
          ${hasCategory ? `<td>${esc(r.product.category || "—")}</td>` : ""}
          <td>${esc(r.vendor.name)}<br><span class="muted">${esc(r.vendor.state)}</span></td>
          <td><span class="badge ${badge}">${statusLabel}</span><br><strong>${r.entry.quantity}</strong> units</td>
          <td>${labelForReason(r.entry.reason_code)}</td>
          <td>${r.batch ? `${esc(r.batch.batch_number)}${r.batch.status === "recalled" ? ' <span class="badge badge-danger">RECALLED</span>' : ""}` : '<span class="muted">Unlinked</span>'}</td>
          <td>${r.batch?.expiry_date ? `${r.batch.expiry_date.slice(0,10)}${expired ? ' <span class="badge badge-danger">EXPIRED</span>' : ""}` : (r.entry.expiry_date ? r.entry.expiry_date.slice(0,10) : "—")}</td>
          <td>${esc(r.entry.notes || "—")}</td>
          <td><button class="link-btn" data-history="${r.entry.product_id}">History</button></td>
        </tr>`;
      });
      html += "</tbody>";
      tbl.innerHTML = html;
    }

    tbl.querySelectorAll("[data-sort]").forEach(th => {
      th.onclick = () => {
        const k = th.dataset.sort;
        if(sortKey === k) sortDir = sortDir === "asc" ? "desc" : "asc";
        else { sortKey = k; sortDir = "asc"; }
        draw();
      };
    });
    tbl.querySelectorAll("[data-history]").forEach(btn => {
      btn.onclick = () => openHistoryModal(btn.dataset.history, null);
    });
  };
  draw();

  document.getElementById("allSearchInput").addEventListener("input", (e) => {
    adminSearch = e.target.value;
    draw();
  });
  document.getElementById("categoryFilterSel").addEventListener("change", (e) => {
    categoryFilter = e.target.value;
    renderAdminAllStockTab(content);
  });

  document.getElementById("exportCsvBtn").onclick = () => exportAllStockCSV();
  document.getElementById("exportXlsxBtn").onclick = () => exportAllStockXLSX();
  document.getElementById("exportPrintBtn").onclick = () => printReport();
}

/* ---- 13d. Admin: Batches Tab ---- */
function renderAdminBatchesTab(content){
  const batches = [...productBatches].sort((a,b) => (a.expiry_date || "9999").localeCompare(b.expiry_date || "9999"));
  const linkedCount = new Set(stockEntries.filter(e => e.batch_id).map(e => e.batch_id)).size;

  content.innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <h2>🧪 Product Batches <span class="mini-stat">${batches.length} total · ${linkedCount} linked</span></h2>
        <button class="export-btn no-print" id="addBatchBtn">+ Create Batch</button>
      </div>
      <p class="mini-stat-note">Batches with <strong>0 days left</strong> are auto-flagged and highlighted for immediate action. <span style="color:var(--ok);">✓</span> = linked to stock · <span style="color:var(--danger);">!</span> = recalled</p>
      <div style="overflow-x:auto;">
        <table class="ftable" id="batchTbl"></table>
      </div>
      <div class="legend-row">
        <span><span class="legend-dot" style="background:#B3261E;"></span> Expired / recalled</span>
        <span><span class="legend-dot" style="background:#E8612D;"></span> Expiring ≤ 30 days</span>
        <span><span class="legend-dot" style="background:#C9A227;"></span> Expiring 31–180 days</span>
        <span><span class="legend-dot" style="background:#2E7D5B;"></span> Safe (&gt; 180 days)</span>
      </div>
    </div>
  `;

  document.getElementById("addBatchBtn").onclick = () => openCreateBatchModal();

  const draw = () => {
    const tbl = document.getElementById("batchTbl");
    let html = `<thead><tr><th>Batch #</th><th>Product</th><th>Supplier</th><th>Manufacture</th><th>Expiry</th><th>Days Left</th><th>Status</th><th>Linked Lines</th><th>Actions</th></tr></thead><tbody>`;
    batches.forEach(b => {
      const p = products.find(pr => pr.id === b.product_id);
      const status = batchDisplayStatus(b);
      const badge = batchStatusBadge(status);
      const linked = stockEntries.filter(e => e.batch_id === b.id).length;
      let daysTxt = "—", daysCls = "";
      if(b.expiry_date){
        const diff = daysUntil(b.expiry_date);
        daysTxt = diff < 0 ? Math.abs(diff) + "d ago" : diff + "d";
        daysCls = diff < 0 ? "danger-text bold" : (diff <= 30 ? "warn-text bold" : (diff <= 180 ? "" : "ok-text"));
      }
      html += `<tr class="${status === 'Expired' || status === 'Recalled' ? 'row-danger' : (status === 'Expiring Soon' ? 'row-warn' : '')}">
        <td><strong>${esc(b.batch_number)}</strong></td>
        <td>${esc(p?.name || "—")}<br><span class="muted">${esc(p?.sku || "")}</span></td>
        <td>${esc(b.supplier || "—")}</td>
        <td>${b.mfg_date ? b.mfg_date.slice(0,10) : "—"}</td>
        <td>${b.expiry_date ? b.expiry_date.slice(0,10) : "—"}</td>
        <td class="${daysCls}">${daysTxt}</td>
        <td><span class="badge ${badge}">${status}</span>${b.status === "recalled" ? ' <span class="badge badge-danger">RECALL</span>' : ""}</td>
        <td>${linked ? `<span class="badge badge-ok">${linked} linked</span>` : `<span class="badge badge-muted">unused</span>`}</td>
        <td class="row-actions">
          <button class="save-btn" data-batch-manage="${b.id}">Manage</button>
          ${b.status !== "recalled" ? `<button class="link-btn danger-link" data-batch-recall="${b.id}">Recall</button>` : `<button class="link-btn" data-batch-restore="${b.id}">Restore</button>`}
        </td>
      </tr>`;
    });
    html += "</tbody>";
    tbl.innerHTML = html;

    tbl.querySelectorAll("[data-batch-manage]").forEach(btn => {
      btn.onclick = () => openManageBatchModal(batches.find(b => b.id === btn.dataset.batchManage));
    });
    tbl.querySelectorAll("[data-batch-recall]").forEach(btn => {
      btn.onclick = async () => {
        const b = batches.find(x => x.id === btn.dataset.batchRecall);
        if(!confirm(`Recall batch "${b.batch_number}"?\n\nRecalled batches can no longer be linked to stock and are surfaced as risk items.`)) return;
        const { error } = await sb.from("product_batches").update({ status: "recalled" }).eq("id", b.id);
        if(error){ showToast("Error: " + error.message); return; }
        showToast("⚠️ Batch recalled");
        await loadAll(); renderAdminBatchesTab(content);
      };
    });
    tbl.querySelectorAll("[data-batch-restore]").forEach(btn => {
      btn.onclick = async () => {
        const b = batches.find(x => x.id === btn.dataset.batchRestore);
        const { error } = await sb.from("product_batches").update({ status: "active" }).eq("id", b.id);
        if(error){ showToast("Error: " + error.message); return; }
        showToast("✓ Batch restored");
        await loadAll(); renderAdminBatchesTab(content);
      };
    });
  };
  draw();
}

  const p = products.find(pr => pr.id === batch.product_id);
  modalRoot.innerHTML = `
    <div class="modal-overlay" id="overlay">
      <div class="modal" style="max-width:640px;">
        <button class="modal-close" id="closeX">×</button>
        <h3>⚙️ Manage Batch — ${esc(batch.batch_number)}</h3>
        <p class="modal-sub">${esc(p?.name || "")} · ${esc(p?.sku || "")} · ${linked.length} linked stock line(s)</p>
        <div class="inline-form-grid">
          <div><label>Batch Number</label><input id="mbNumber" type="text" value="${esc(batch.batch_number)}"></div>

        </div>
        <label>Assign this batch to unlinked stock lines</label>
        <select id="mbAssign" style="margin-bottom:10px;">
          <option value="">— Select unlinked stock line (product ${esc(p?.name || "")}) —</option>
          ${stockEntries.filter(e => !e.batch_id && e.product_id === batch.product_id).map(e => {
            const v = vendors.find(vd => vd.id === e.vendor_id);
            return `<option value="${e.id}">${esc(v?.name || "?")} · ${e.quantity} units</option>`;
          }).join("")}
        </select>
        ${linked.length ? `
          <label>Delete batch permanently</label>
          <p class="mini-stat-note" style="color:var(--danger);">${linked.length} stock line(s) are linked. Deleting unlinks them (stock remains, batch becomes “Unlinked”).</p>` : ""}
        <div class="modal-actions">
          <button class="btn-secondary" id="cancelMb">Cancel</button>
          ${linked.length ? `<button class="export-btn alt" id="delMb">🗑 Delete Batch</button>` : ""}
          <button class="btn-primary" style="width:auto;" id="saveMb">Save Changes</button>
        </div>
      </div>
    </div>
  `;
  bindModalClose(["closeX","cancelMb"]);

  const delBtn = document.getElementById("delMb");
  const assignSel = document.getElementById("mbAssign");

  assignSel.onchange = async () => {
    if(!assignSel.value) return;
    const { error } = await sb.from("stock_entries").update({ batch_id: batch.id }).eq("id", assignSel.value);
    if(error){ showToast("Error: " + error.message); return; }
    showToast("✓ Batch linked to stock line");
    closeModal();
    await loadAll();
    renderAdminBatchesTab(document.getElementById("tabContent"));
  };

  saveMb.onclick = async () => {
    const number = document.getElementById("mbNumber").value.trim();
    const supplier = document.getElementById("mbSupplier").value.trim() || null;
    const mfg_date = document.getElementById("mbMfg").value || null;
    const expiry_date = document.getElementById("mbExp").value || null;
    if(!number){ showToast("Batch number is required"); return; }
    const dup = productBatches.find(b => b.batch_number.toLowerCase() === number.toLowerCase() && b.id !== batch.id);
    if(dup){ showToast("That batch number already exists on another batch"); return; }
    const { error } = await sb.from("product_batches").update({ batch_number: number, supplier, mfg_date, expiry_date }).eq("id", batch.id);
    if(error){ showToast("Error: " + error.message); return; }
    showToast("✓ Batch updated");
    closeModal();
    await loadAll();
    renderAdminBatchesTab(document.getElementById("tabContent"));
  };

  if(delBtn){
    delBtn.onclick = async () => {
      if(!confirm(`Permanently delete batch "${batch.batch_number}"?\n\nLinked stock lines will become "Unlinked". This cannot be undone.`)) return;
      const { error } = await sb.from("product_batches").delete().eq("id", batch.id);
      if(error){ showToast("Error: " + error.message); return; }
      showToast("Batch deleted");
      closeModal();
      await loadAll();
      renderAdminBatchesTab(document.getElementById("tabContent"));
    };
  }

function renderAdminFinancialsTab(content){

  const reasonOptions = REASONS.filter(r => REASON_LABELS[r]);

    const p = products.find(pr => pr.id === e.product_id);
    return s + e.quantity * (p?.selling_price || 0);
  }, 0);
  const avgDaily = stockHistory.length ? Math.round(totalQty / Math.max(1, Math.ceil((Date.now() - new Date(stockHistory[0].recorded_at).getTime()) / 86400000))) : 0;

  content.innerHTML = `

  `;

  const draw = () => {
    let rows = audit;
    const vf = document.getElementById("finVendorFilter")?.value || "all";
    const rf = document.getElementById("finReasonFilter")?.value || "all";
    if(vf !== "all") rows = rows.filter(a => a.vendor_id === vf);
    if(rf !== "all") rows = rows.filter(a => a.reason_code === rf);

    document.getElementById("finCount").textContent = `${rows.length} adjustment records shown.`;

    const tbl = document.getElementById("finTbl");
    if(!rows.length){
      tbl.innerHTML = `<tbody><tr><td colspan="8" style="text-align:center;color:#6B7280;padding:28px;">No adjustments match the filters.</td></tr></tbody>`;
      return;
    }
    let html = `<thead><tr><th>#</th><th>Date</th><th>Vendor</th><th>Product</th><th>Reason</th><th>Qty Change</th><th>Notes</th></tr></thead><tbody>`;
    rows.forEach((a, i) => {
      const v = vendors.find(vd => vd.id === a.vendor_id);
      const p = products.find(pr => pr.id === a.product_id);
      const delta = a.new_qty - a.previous_qty;
      const deltaCls = delta < 0 ? "danger-text" : "ok-text";
      html += `<tr>
        <td>${i + 1}</td>
        <td>${new Date(a.created_at).toLocaleString()}</td>
        <td>${esc(v?.name || "—")}<br><span class="muted">${esc(v?.state || "")}</span></td>
        <td>${esc(p?.name || "—")}<br><span class="muted">${esc(p?.sku || "")}</span></td>
        <td>${labelForReason(a.reason_code)}</td>
        <td class="${deltaCls}">${a.previous_qty} → ${a.new_qty} (${delta >= 0 ? "+" : ""}${delta})</td>
        <td>${esc(a.notes || "—")}</td>
      </tr>`;
    });
    html += "</tbody>";
    tbl.innerHTML = html;
  };
  draw();

  document.getElementById("finVendorFilter").onchange = draw;
  document.getElementById("finReasonFilter").onchange = draw;

  document.getElementById("finExportBtn").onclick = () => exportAuditCSV();
  document.getElementById("finPrintBtn").onclick = () => printReport();
}

/* ---- 13f. Admin: Products Tab ---- */
function renderAdminProductsTab(content){
  const productStats = (pid) => {
    const entries = stockEntries.filter(e => e.product_id === pid);
    let qty = 0, value = 0;
    entries.forEach(e => { qty += e.quantity; value += e.quantity * ((products.find(p => p.id === pid))?.selling_price || 0); });
    return { lines: entries.length, qty, value };
  };

  content.innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <h2>🧬 Product Master Catalog</h2>
        <button class="export-btn no-print" id="addProductBtn">+ Add Product</button>
      </div>
      <p class="panel-note"><strong>Visibility</strong> controls which products state vendors can see in their storefront. Hiding a product removes it from vendor stock tables but keeps all history.</p>
      <div style="overflow-x:auto;">
        <table class="ftable" id="prodTbl"></table>
      </div>
    </div>
  `;

  document.getElementById("addProductBtn").onclick = () => openProductModal(null);

  const draw = () => {
    const tbl = document.getElementById("prodTbl");
    let html = `<thead><tr><th>Product</th><th>Category</th><th>SKU</th><th>Unit Price</th><th>Thresholds</th><th>Stock</th><th>Value</th><th>Visibility</th><th>Actions</th></tr></thead><tbody>`;
    products.forEach(p => {
      const s = productStats(p.id);
      const visible = isProductVisible(p.id);
      html += `<tr>
        <td><strong>${esc(p.name)}</strong>${p.description ? `<br><span class="muted">${esc(p.description.length > 60 ? p.description.slice(0,60) + "…" : p.description)}</span>` : ""}</td>
        <td>${esc(p.category || "—")}</td>
        <td>${esc(p.sku)}</td>
        <td>₹${formatCurrency(p.selling_price)}</td>
        <td class="muted">Low ${p.low_stock_threshold} · Reorder ${p.reorder_threshold}</td>
        <td>${s.lines ? `${s.qty} units<br><span class="muted">${s.lines} lines</span>` : '<span class="badge badge-muted">no stock</span>'}</td>
        <td>₹${formatCurrency(s.value)}</td>
        <td>${(visibilityMap[p.id]?.size || 0) > 0 ? `<span class="badge badge-warn">Restricted (${visibilityMap[p.id].size})</span>` : '<span class="badge badge-ok">Visible to all</span>'}</td>
        <td class="row-actions">
          <button class="save-btn" data-prod-edit="${p.id}">Edit</button>
          <button class="link-btn" data-prod-vis="${p.id}">${(visibilityMap[p.id]?.size || 0) > 0 ? "Allow all" : "Restrict"}</button>
          <button class="link-btn danger-link" data-prod-del="${p.id}">Delete</button>
        </td>
      </tr>`;
    });
    html += "</tbody>";
    tbl.innerHTML = html;

    tbl.querySelectorAll("[data-prod-edit]").forEach(btn => {
      btn.onclick = () => openProductModal(products.find(p => p.id === btn.dataset.prodEdit));
    });
    tbl.querySelectorAll("[data-prod-vis]").forEach(btn => {
      btn.onclick = async () => {
        const p = products.find(pr => pr.id === btn.dataset.prodVis);
        const current = new Set(visibilityMap[p.id] || []);
        if(current.size){
          const removeAll = confirm(`"${p.name}" is currently restricted to ${current.size} vendor(s).\n\nClick OK to make it visible to ALL vendors (deletes restriction rows).`);
          if(!removeAll) return;
          const { error } = await sb.from("product_visibility").delete().eq("product_id", p.id);
          if(error){ showToast("Error: " + error.message); return; }
          showToast(`${p.name} now visible to all vendors`);
        } else {
          openRestrictModal(p);
          return;
        }
        await loadAll();
        renderAdminProductsTab(content);
      };
    });
    tbl.querySelectorAll("[data-prod-del]").forEach(btn => {
      btn.onclick = async () => {
        const p = products.find(pr => pr.id === btn.dataset.prodDel);
        const s = productStats(p.id);
        if(!confirm(`Delete product "${p.name}" (${p.sku})?\n\nIt currently has ${s.lines} stock line(s) and ${s.qty} units on hand.\n\nThis also deletes its batches, stock entries, and audit history. This cannot be undone!`)) return;
        const { error } = await sb.from("products").delete().eq("id", p.id);
        if(error){ showToast("Error: " + error.message); return; }
        showToast("Product deleted");
        await loadAll();
        renderAdminProductsTab(content);
      };
    });
  };
  draw();
}

function openRestrictModal(product){
  const current = new Set(visibilityMap[product.id] || []);
  modalRoot.innerHTML = `
    <div class="modal-overlay" id="overlay">
      <div class="modal" style="max-width:560px;">
        <button class="modal-close" id="closeX">×</button>
        <h3>🔒 Restrict — ${esc(product.name)}</h3>
        <p class="modal-sub">Select which vendors may see this product. Unchecked vendors will not see it in their stock tables. No selection = visible to all.</p>
        <div style="max-height:320px;overflow-y:auto;border:1px solid #E7E2D6;border-radius:4px;padding:12px;">
          ${vendors.map(v => `
            <label style="display:flex;align-items:center;gap:8px;padding:6px 4px;font-size:13px;cursor:pointer;">
              <input type="checkbox" value="${v.id}" ${current.has(v.id) ? "checked" : ""}> ${esc(v.name)} <span class="muted">(${esc(v.state)})</span>
            </label>`).join("") || `<p class="muted">No vendors exist yet — create vendor accounts from the header button.</p>`}
        </div>
        <p class="mini-stat-note">Restriction rows: ${current.size} current · ${vendors.length} vendors</p>
        <div class="modal-actions">
          <button class="btn-secondary" id="cancelRv">Cancel</button>
          <button class="btn-primary" style="width:auto;" id="saveRv" ${!vendors.length ? "disabled" : ""}>Save Visibility</button>
        </div>
      </div>
    </div>
  `;
  bindModalClose(["closeX","cancelRv"]);

  document.getElementById("saveRv").onclick = async () => {
    const checked = new Set([...modalRoot.querySelectorAll('input[type="checkbox"]:checked')].map(cb => cb.value));
    const toDelete = [...current].filter(vid => !checked.has(vid));
    const toInsert = [...checked].filter(vid => !current.has(vid));
    const tasks = [];
    toDelete.forEach(vid => tasks.push(sb.from("product_visibility").delete().eq("product_id", product.id).eq("vendor_id", vid)));
    toInsert.forEach(vid => tasks.push(sb.from("product_visibility").insert({ product_id: product.id, vendor_id: vid })));
    const results = await Promise.all(tasks);
    const failed = results.filter(r => r.error);
    if(failed.length){ showToast("Error: " + failed[0].error.message); return; }
    showToast("✓ Visibility updated");
    closeModal();
    await loadAll();
    renderAdminProductsTab(document.getElementById("tabContent"));
  };
}

function exportCSV(filename, rows){
  if(!rows.length){ showToast("Nothing to export"); return; }
  const headers = Object.keys(rows[0]);
  const escapeCell = (v) => {
    const s = String(v === null || v === undefined ? "" : v);
    return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  const lines = [
    headers.map(escapeCell).join(","),
    ...rows.map(r => headers.map(h => escapeCell(r[h])).join(","))
  ];
  downloadFile(filename, "\uFEFF" + lines.join("\r\n"), "text/csv;charset=utf-8;");
}

function openHistoryModal(productId, vendorId){
  const product = products.find(p => p.id === productId);
  if(!product) return;
  const events = [...stockHistory]
    .filter(h => h.product_id === productId && (!vendorId || h.vendor_id === vendorId))
    .sort((a,b) => new Date(b.recorded_at) - new Date(a.recorded_at))
    .slice(0, 100);

  modalRoot.innerHTML = `
    <div class="modal-overlay" id="overlay">
      <div class="modal" style="max-width:700px;">
        <button class="modal-close" id="closeX">×</button>
        <h3>🕓 Stock History — ${esc(product.name)}</h3>
        <p class="modal-sub">${esc(product.sku)} · ${events.length} event(s) shown (newest first)</p>
        <table class="ftable" id="histTbl"></table>
      </div>
    </div>
  `;
  bindModalClose(["closeX"]);

  const tbl = document.getElementById("histTbl");
  if(!events.length){
    tbl.outerHTML = `<p class="panel-note empty-note">No history events recorded for this product yet. History is captured when stock quantities change.</p>`;
    return;
  }
  let html = `<thead><tr><th>Date</th><th>Change</th><th>Quantity</th><th>Vendor</th></tr></thead><tbody>`;
  const asc = [...events].sort((a,b) => new Date(a.recorded_at) - new Date(b.recorded_at));
  asc.forEach((h, i) => {
    const v = vendors.find(vd => vd.id === h.vendor_id);
    const delta = i === 0 ? null : h.quantity - asc[i-1].quantity;
    html += `<tr>
      <td>${new Date(h.recorded_at).toLocaleString()}</td>
      <td>${delta === null ? '<span class="badge badge-ok">Baseline</span>' : `<span class="${delta < 0 ? 'danger-text' : 'ok-text'}">${delta > 0 ? "+" : ""}${delta}</span>`}</td>
      <td><strong>${h.quantity}</strong>${delta !== null ? ` <span class="muted">(was ${asc[i-1].quantity})</span>` : ""}</td>
      <td>${esc(v?.name || "—")}</td>
    </tr>`;
  });
  html += "</tbody>";
  tbl.innerHTML = html;
}

/* ============================================================
   15. ROUTER + INIT
   ============================================================ */
async function render(){
  if(!session) return renderLogin();
  if(!vendorRow){
    let p = 0;
    const tries = 10;
    while(p < tries && !document.getElementById("main")){
      await renderDashboard();
      p++;
      if(p < tries) await new Promise(r => setTimeout(r, 500));
    }
    return;
  }
  if(document.getElementById("main")){
    const isAdmin = vendorRow.is_admin;
    if(isAdmin) renderAdminView();
    else renderVendorView();
  } else {
    renderDashboard();
  }
}

async function boot(){
  try {
    session = (await sb.auth.getSession()).data.session;
  } catch(e) {
    session = null;
  }
  if(!session){
    renderLogin();
  } else {
    await loadVendorProfile();
    const apply = async () => {
      await loadAll();
      renderDashboard();
    };
    await apply();
  }
}

window.addEventListener("load", boot);
</script>
